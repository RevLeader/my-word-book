<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>My Word Book</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;color:#17202a;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}header{background:#111827;color:#fff;padding:calc(15px + env(safe-area-inset-top)) 15px 15px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:24px}.sub{opacity:.7;font-size:12px;margin:3px 0 10px}.search{display:flex;gap:7px}input,textarea{font:inherit;border:1px solid #d0d5dd;border-radius:12px;padding:11px;background:#fff;width:100%}.search input{flex:1}button{font:inherit;border:0;border-radius:11px;padding:10px 13px;background:#111827;color:#fff;font-weight:650}button.secondary{background:#e5e7eb;color:#17202a}button.good{background:#dcfae6;color:#067647}main{max-width:760px;margin:auto;padding:12px 12px 45px}.card{background:#fff;border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 2px 12px #0001}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.word{font-size:28px;font-weight:800}.pron,.pos,.muted{color:#667085;font-size:12px}.pos{font-style:italic}.label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#667085;font-weight:800;margin:13px 0 4px}.row{display:flex;gap:7px;flex-wrap:wrap}.pill{background:#eef4ff;border-radius:999px;padding:5px 8px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}.empty{text-align:center;padding:32px;color:#667085}.tabs{display:flex;gap:7px;margin:10px 0}.tabs button{flex:1}.suggestion{padding:8px 2px;border-bottom:1px solid #eee}.small{font-size:12px;padding:7px 9px}.reviewword{text-align:center;font-size:36px;font-weight:850;padding:20px}.progress{height:6px;background:#eaecf0;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:#111827}.camera{border:1px dashed #98a2b3;border-radius:13px;padding:12px;text-align:center}.preview{max-width:100%;max-height:230px;border-radius:10px;margin-top:8px}</style></head><body><header><h1>📚 My Word Book</h1><div class="sub">Personal dictionary + vocabulary trainer</div><div class="search"><input id="search" placeholder="Type a word to look up…" autocapitalize="none" autocomplete="off"><button onclick="lookup()">🔎</button></div><div id="sug" class="hidden"></div></header><main><div class="tabs"><button id="libtab" onclick="view('library')">📖 Dictionary</button><button id="revtabs" class="secondary" onclick="view('review')">🧠 Review</button></div><section id="result"></section><section id="savebox" class="card hidden"><div class="top"><b>Save to My Words</b><button class="secondary small" onclick="$('savebox').classList.add('hidden')">Close</button></div><div id="savepreview"></div><div class="label">Example sentence (optional)</div><textarea id="example" placeholder="Optional"></textarea><div class="grid"><div><div class="label">Book / source (optional)</div><input id="book" placeholder="Optional"></div><div><div class="label">Tag (optional)</div><input id="tag" placeholder="Optional"></div></div><button style="margin-top:10px" onclick="saveWord()">💾 Save word</button></section><section id="camera" class="card hidden"><div class="top"><b>📷 Capture a word</b><button class="secondary small" onclick="$('camera').classList.add('hidden')">Close</button></div><div class="muted">Take a photo, then use iPhone Live Text to copy the word into the search box.</div><input id="photo" type="file" accept="image/*" capture="environment" style="margin-top:9px"><img id="preview" class="preview hidden"></section><section id="review" class="card hidden"></section><section id="library"></section><section class="card"><div class="top"><b>💾 Backup</b><span class="muted">Stored on this device</span></div><div class="row" style="margin-top:8px"><button class="secondary small" onclick="exportData()">Export</button><button class="secondary small" onclick="$('import').click()">Import</button><button class="secondary small" onclick="$('camera').classList.remove('hidden')">📷 Camera</button><input id="import" class="hidden" type="file" accept=".json" onchange="importData(event)"></div></section></main><script>
const KEY='my-word-book-v3', $=id=>document.getElementById(id);let db=JSON.parse(localStorage.getItem(KEY)||'[]'),current=null,mode='library',ri=0,reveal=false,timer;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function persist(){localStorage.setItem(KEY,JSON.stringify(db))}function api(u,ms=7000){let c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal,cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).finally(()=>clearTimeout(t))}
$('search').addEventListener('input',()=>{clearTimeout(timer);let q=$('search').value.trim();if(!q){$('sug').classList.add('hidden');return}timer=setTimeout(()=>api('https://api.datamuse.com/sug?s='+encodeURIComponent(q)+'&max=6').then(a=>{$('sug').innerHTML=a.map(x=>`<div class="suggestion" onclick="pick('${x.word.replace(/'/g,"\\'")}')">${esc(x.word)}</div>`).join('');$('sug').classList.toggle('hidden',!a.length)}).catch(()=>{}),150)});
$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();lookup()}});function pick(w){$('search').value=w;$('sug').classList.add('hidden');lookup()}
async function lookup(){let w=$('search').value.trim();if(!w)return;$('result').innerHTML='<div class="card muted">🔎 Looking up…</div>';try{let a=await api('https://api.datamuse.com/words?sp='+encodeURIComponent(w)+'&md=dpr&max=10');let e=a.find(x=>x.word.toLowerCase()===w.toLowerCase())||a[0];if(!e)throw Error('not found');let [sy,an]=await Promise.allSettled([api('https://api.datamuse.com/words?rel_syn='+encodeURIComponent(w)+'&max=12'),api('https://api.datamuse.com/words?rel_ant='+encodeURIComponent(w)+'&max=12')]);let tags=e.tags||[],pos=tags.filter(x=>['n','v','adj','adv'].includes(x)).map(x=>({n:'noun',v:'verb',adj:'adjective',adv:'adverb'}[x]))[0]||'',pron=(tags.find(x=>x.startsWith('pron:'))||'').replace('pron:',''),defs=(e.defs||[]).map(x=>x.includes('\t')?x.split('\t').slice(1).join('\t'):x).slice(0,5);if(!defs.length)throw Error('no definition');current={word:e.word,defs,pos,pron,syn:sy.status==='fulfilled'?sy.value.map(x=>x.word).slice(0,10):[],ant:an.status==='fulfilled'?an.value.map(x=>x.word).slice(0,10):[],source:'Datamuse'};showResult()}catch(e){try{let a=await api('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w),6000),e=a[0],defs=[],sy=[],an=[];(e.meanings||[]).forEach(m=>(m.definitions||[]).forEach(d=>{defs.push(d.definition);sy.push(...(d.synonyms||[]));an.push(...(d.antonyms||[]))}));current={word:e.word||w,defs:defs.slice(0,5),pos:e.meanings?.[0]?.partOfSpeech||'',pron:e.phonetic||'',syn:[...new Set(sy)].slice(0,10),ant:[...new Set(an)].slice(0,10),source:'Dictionary API'};showResult()}catch{ $('result').innerHTML=`<div class="card"><b>Couldn't look up “${esc(w)}”</b><div class="muted" style="margin-top:6px">Dictionary services could not be reached. Check your internet connection.</div></div>`}}}
function showResult(){let x=current;$('result').innerHTML=`<article class="card"><div class="top"><div><div class="word">${esc(x.word)}</div>${x.pron?`<div class="pron">/${esc(x.pron)}/</div>`:''}${x.pos?`<div class="pos">${esc(x.pos)}</div>`:''}</div><button class="good small" onclick="openSave()">＋ Save</button></div><div class="label">Definition</div>${x.defs.map((d,i)=>`<div style="margin:6px 0"><b>${i+1}.</b> ${esc(d)}</div>`).join('')}${x.syn.length?`<div class="label">Synonyms</div><div class="row">${x.syn.map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div>`:''}${x.ant.length?`<div class="label">Antonyms</div><div class="row">${x.ant.map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div>`:''}<div class="muted" style="margin-top:12px">Source: ${esc(x.source)}</div></article>`}
function openSave(){$('savebox').classList.remove('hidden');$('savepreview').innerHTML=`<b>${esc(current.word)}</b><div class="muted">${esc(current.defs[0]||'')}</div>`;$('example').value='';$('book').value='';$('tag').value=''}function saveWord(){let old=db.find(x=>x.word.toLowerCase()===current.word.toLowerCase()),x={...current,id:old?.id||Date.now(),example:$('example').value.trim(),book:$('book').value.trim(),tag:$('tag').value.trim(),learned:old?.learned||false,nextReview:old?.nextReview||Date.now()};db=db.filter(a=>a.id!==x.id);db.unshift(x);persist();$('savebox').classList.add('hidden');renderLibrary();alert('Saved to My Words.')}
function view(v){mode=v;$('result').classList.toggle('hidden',v!=='library');$('library').classList.toggle('hidden',v!=='library');$('review').classList.toggle('hidden',v!=='review');$('libtab').className=v==='library'?'':'secondary';$('revtabs').className=v==='review'?'':'secondary';if(v==='review')renderReview();else renderLibrary()}function renderLibrary(){$('library').innerHTML=db.length?`<div class="card"><b>My Words</b><span class="muted"> · ${db.length} saved</span></div>`+db.map(x=>`<article class="card"><div class="top"><div><div class="word">${esc(x.word)}</div><div class="pos">${esc(x.pos||'')}</div></div><button class="${x.learned?'good':'secondary'} small" onclick="learn(${x.id})">${x.learned?'✓ Learned':'Mark learned'}</button></div>${x.defs[0]?`<div class="label">Meaning</div>${esc(x.defs[0])}`:''}${x.syn.length?`<div class="label">Synonyms</div>${x.syn.map(s=>`<span class="pill">${esc(s)}</span>`).join(' ')}`:''}${x.book?`<div class="label">Source</div><div class="muted">📖 ${esc(x.book)}</div>`:''}</article>`).join(''):'<div class="empty">Look up a word above, then tap Save.</div>'}function learn(id){let x=db.find(a=>a.id===id);x.learned=true;x.nextReview=Date.now()+7*864e5;persist();renderLibrary()}
function renderReview(){let d=db.filter(x=>!x.learned||x.nextReview<=Date.now());if(!d.length){$('review').innerHTML='<div class="empty">🎉 Nothing due right now.</div>';return}if(ri>=d.length)ri=0;let x=d[ri];$('review').innerHTML=`<div class="muted">${ri+1} of ${d.length}</div><div class="progress"><i style="width:${(ri+1)/d.length*100}%"></i></div><div class="reviewword">${esc(x.word)}</div>${reveal?`<div><b>${esc(x.defs[0]||'No definition')}</b><div class="label">Synonyms</div>${esc(x.syn.join(', ')||'None')}</div>`:'<div class="empty">Think of the meaning first.</div>'}<div class="row" style="justify-content:center;margin-top:12px">${reveal?`<button class="good" onclick="rate(${x.id},1)">Easy ✓</button><button onclick="rate(${x.id},0)">Need practice</button>`:'<button onclick="reveal=true;renderReview()">Reveal answer</button>'}</div>`}function rate(id,e){let x=db.find(a=>a.id===id);x.learned=!!e;x.nextReview=Date.now()+(e?7:1)*864e5;ri++;reveal=false;persist();renderReview()}
function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-word-book-backup.json';a.click()}function importData(e){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;db=x;persist();renderLibrary();alert('Backup imported.')}catch{alert('Invalid backup.')}};r.readAsText(e.target.files[0])}$('photo').onchange=e=>{let f=e.target.files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').classList.remove('hidden')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});renderLibrary();
</script></body></html>
